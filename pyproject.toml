[build-system]
requires = [
  "setuptools>=61.0.0",
  "wheel",
  "build",
  "torch>=2.7.0,<=2.7.1",
  "ninja",
  "kintera>=1.3.4,<1.4.0",
  ]
build-backend = "setuptools.build_meta"

[project]
name = "snapy"
dynamic = ["version"]
description = "Compressible Finite Volume Solver for Atmospheric Dynamics, Chemistry and Thermodynamics"
authors = [
  { name="Cheng Li", email="chengcli@umich.edu" },
]
license = { text = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "kintera>=1.3.4,<1.4.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: C",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Homepage = "https://github.com/chengcli/snapy"
Documentation = "https://snapy.readthedocs.io"

[project.scripts]
pd-combine = "snapy.api.pd_combine:main"
pd-inspect = "snapy.api.pd_inspect:main"

[tool.setuptools.dynamic.version]
attr = "snapy.__version__"

[tool.setuptools]
packages = ["snapy"]
include-package-data = false
script-files = ["api/pd-run", "api/slurm.sbatch"]

[tool.setuptools.package-data]
"snapy" = ["snap/**/*", "lib/*.so", "lib/*.dylib", "snapy/*.pyi", "py.typed", "api/*"]

[tool.setuptools.exclude-package-data]
"snapy" = ["csrc/**/*"]
