reference-state: {Tref: 0., Pref: 1.e5}
species:
  - name: dry
    composition: {O: 0.4200039819342909, N: 1.560014790041652, Ar: 0.01}
    cv_R: 2.5
  - name: H2O
    composition: {H: 2, O: 1}
    cv_R: 1.534301
    u0_R: 0.
  - name: H2O(l)
    composition: {H: 2, O: 1}
    cv_R: 7.52031
    u0_R: -6786.6602
reactions:
  - equation: H2O <=> H2O(l)
    type: nucleation
    rate-constant: {formula: h2o_bryan}
geometry:
  type: cartesian
  bounds: {x1min: 0., x1max: 64., x2min: 0., x2max: 1., x3min: 0., x3max: 1.}
  cells: {nx1: 32, nx2: 1, nx3: 1, nghost: 3}
dynamics:
  equation-of-state:
    type: ideal-moist
    limiter: true
    density-floor: 1.e-10
    pressure-floor: 1.e-10
    max-iter: 20
    ftol: 1.e-8
  reconstruct:
    vertical: {type: weno5, scale: false, shock: false}
    horizontal: {type: weno5, scale: false, shock: false}
  riemann-solver: {type: lmars}
boundary-condition:
  external: {x1-inner: reflecting, x1-outer: reflecting}
integration: {type: rk3, cfl: 0.9, implicit-scheme: 0}
forcing: {}
