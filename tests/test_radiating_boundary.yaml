reference-state: {Tref: 300., Pref: 100000.}
species:
  - name: dry
    composition: {N: 2}
    cv_R: 2.5
  - name: H2O
    composition: {H: 2, O: 1}
    cv_R: 3.
  # Keep the same species catalog as test_radiating_moist.yaml: Kintera
  # initializes its process-wide catalog from the first loaded configuration.
  - name: cloud
    composition: {H: 2, O: 1}
    cv_R: 9.
dynamics:
  equation-of-state: {type: ideal-moist, limiter: false}
  reconstruct:
    vertical: {type: plm, scale: false, shock: false}
    horizontal: {type: plm, scale: false, shock: false}
  riemann-solver: {type: hllc}
integration: {type: rk3, cfl: 0.4, implicit-scheme: 0}
geometry:
  type: cartesian
  cells: {nx1: 8, nx2: 8, nx3: 8, nghost: 3}
  bounds: {x1min: 0., x1max: 1., x2min: 0., x2max: 1., x3min: 0., x3max: 1.}
boundary-condition:
  external:
    x1-inner: outflow
    x1-outer: outflow
    x2-inner: outflow
    x2-outer: outflow
    x3-inner: outflow
    x3-outer: outflow
