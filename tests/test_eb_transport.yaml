reference-state: {Tref: 0., Pref: 1.e5}
species:
  - name: dry
    composition: {N: 2}
    cv_R: 2.5
geometry:
  type: cartesian
  bounds: {x1min: 0., x1max: 1., x2min: 0., x2max: 1., x3min: 0., x3max: 1.}
  cells: {nx1: 16, nx2: 16, nx3: 1, nghost: 3}
dynamics:
  equation-of-state: {type: ideal-gas, limiter: false, temperature-floor: 1.e-6}
  riemann-solver: {type: hllc}
scalar: {names: [tracer], reconstruct: {type: dc}}
boundary-condition:
  external:
    x1-inner: reflecting
    x1-outer: reflecting
    x2-inner: reflecting
    x2-outer: reflecting
integration: {type: rk3, implicit-scheme: 0, cfl: 0.3}
