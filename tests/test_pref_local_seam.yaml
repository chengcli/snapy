# Smallest column for the local-block p_ref seam. Two interior cells, split
# into two blocks by the test. Dry ideal gas, constant gravity.
reference-state:
  Tref: 300.
  Pref: 1.e5

species:
  - name: dry
    composition: {O: 0.42, N: 1.56, Ar: 0.01}
    cv_R: 2.5

geometry:
  type: cartesian
  bounds: {x1min: 0., x1max: 4., x2min: 0., x2max: 1., x3min: 0., x3max: 1.}
  cells: {nx1: 4, nx2: 1, nx3: 1, nghost: 2}

dynamics:
  equation-of-state:
    type: ideal-gas

forcing:
  const-gravity:
    grav1: -10.

boundary-condition:
  external:
    x1-inner: reflecting
    x1-outer: reflecting
