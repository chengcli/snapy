# Fixture for tests/test_parentless_cloud_nb1.cpp -- one card for the whole binary
# (kintera's species table is process-global and the first card wins). `rain`
# is made by coagulation, not nucleation, as the precipitation of the shipped
# CRM cards is, so it has no nucleation parent.
reference-state:
  Tref: 300.
  Pref: 1.e5

species:
  - name: dry
    composition: {O: 0.42, N: 1.56, Ar: 0.01}
    cv_R: 2.5

  - name: vapor
    composition: {H: 2, O: 1}
    cv_R: 2.5
    u0_R: 0.

  - name: cloud
    composition: {H: 2, O: 1}
    cv_R: 9.0
    u0_R: -3430.

  - name: rain
    composition: {H: 2, O: 1}
    cv_R: 9.0
    u0_R: -3430.

reactions:
  - equation: vapor <=> cloud
    type: nucleation
    rate-constant: {formula: h2o_ideal}

  - equation: cloud => rain
    type: coagulation
    rate-constant: {A: 0.1, b: 0, Ea_R: 0.}

  - equation: rain => vapor
    type: evaporation
    rate-constant: {formula: h2o_ideal, diff_c: 0.2e-4, diff_T: 0., diff_P: 0., vm: 18.e-6, diameter: 1.e-4}

geometry:
  type: cartesian
  bounds: {x1min: 0., x1max: 16., x2min: 0., x2max: 1., x3min: 0., x3max: 1.}
  cells: {nx1: 16, nx2: 1, nx3: 1, nghost: 2}

dynamics:
  equation-of-state:
    type: ideal-moist
    limiter: true

boundary-condition:
  external:
    x1-inner: reflecting
    x1-outer: reflecting

# The tests split this 16-cell column along x1 by setting the layout to cubed
# and nb1 programmatically; no distribute block here so nb1 = 1 by default.
