reference-state:
  Tref: 0.
  Pref: 1.e5

species:
  - name: dry
    composition: {Al: 1.}
    cv_R: 2.5

geometry:
  type: cartesian
  bounds: {x1min: -0.00001, x1max: 0.00001, x2min: -0.00001, x2max: 0.00001, x3min:
  -0.00001, x3max: 0.00001}
  cells: {nx1: 256, nx2: 256, nx3: 256, nghost: 3}

dynamics:
  equation-of-state:
    type: aneos
    eos-file: example.aneos
    density-floor:  1.e-6
    pressure-floor: 100.
    limiter: false

  vertical-projection:
    type: none
    pressure-margin: 1.e-6

  reconstruct:
    vertical: {type: plm, scale: false, shock: true}
    horizontal: {type: plm, scale: false, shock: true}

  riemann-solver:
    type: hllc

boundary-condition:
  internal:
    solid-density: 1.e3
    solid-pressure: 1.9
    max-iter: 5

  external:
    x1-inner: outflow
    x1-outer: outflow
    x2-inner: outflow
    x2-outer: outflow
    x3-inner: outflow
    x3-outer: outflow

integration:
  type: rk3
  cfl: 0.5
  implicit-scheme: 0
  nlim: 1000
  tlim: 1.e9
