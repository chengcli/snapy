reference-state:
  Tref: 0.
  Pref: 1.e5

species:
  - name: dry
    composition: {H: 1.5, He: 0.15}
    cv_R: 2.5

geometry:
  type: cartesian

  bounds:
    x1min: 0.
    x1max: 300.E3
    x2min: 0.
    x2max: 3000.E3
    x3min: 0.
    x3max: 3000.E3

  cells:
    nx1: 100
    nx2: 48
    nx3: 48
    nghost: 3

distribute:
  backend: gloo
  layout: slab
  nb2: 2
  nb3: 2
  verbose: false

dynamics:
  equation-of-state:
    type: ideal-gas
    density-floor:  1.e-10
    pressure-floor: 1.e-10
    tracer-floor: 1.e-10
    limiter: true
    max-iter: 10
    ftol: 1.e-6

  vertical-projection:
    type: temperature
    pressure-margin: 1.e-6

  reconstruct:
    vertical: {type: weno5, scale: true, shock: true}
    horizontal: {type: weno5, scale: true, shock: true}

  riemann-solver:
    type: lmars

boundary-condition:
  external:
    x1-inner: reflecting
    x1-outer: reflecting
    x2-inner: reflecting
    x2-outer: reflecting
    x3-inner: reflecting
    x3-outer: reflecting

integration:
  type: rk3
  cfl: 0.9
  implicit-scheme: 0
  nlim: -1
  tlim: 100.e5
  ncycle_out: 1

outputs:
  - type: restart
    dt: 10.E5
  - type: netcdf
    variables: [prim]
    dt: 1.
  - type: netcdf
    variables: [thermo]
    dt: 1.

forcing:
  const-gravity:
    grav1: -22.

problem:
  Ps: 100.e5
  Ts: 600.
  Tmin: 110.
