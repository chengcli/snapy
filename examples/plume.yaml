
geometry:
  type: cartesian
  bounds: {x1min: 0., x1max: 100}
  cells: {nx1: 100, nghost: 3}

dynamics:
  equation-of-state:
    type: plume-eos

  reconstruct:
    vertical: {type: weno5, scale: false, shock: false}
    horizontal: {type: weno5, scale: false, shock: false}

  riemann-solver:
    type: plume-roe

boundary-condition:
  external:
    x1-inner: custom
    x1-outer: outflow

integration:
  type: rk3
  cfl: 0.4
  nlim: -1
  tlim: 100
  ncycle_out: 1

outputs:
  - type: netcdf
    variables: [prim]
    dt: 0.1
