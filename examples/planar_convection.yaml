reference-state: {Tref: 0., Pref: 1.}
species:
  - name: dry
    composition: {O: 0.42, N: 1.56, Ar: 0.01}
    cv_R: 1.5
dynamics:
  equation-of-state:
    type: ideal-gas
    weight: 8.31446  # runner pins this to kintera::constants::Rgas, so R=1
    gammad: 1.6666666666666667
    density-floor: 1.e-12
    pressure-floor: 1.e-12
    temperature-floor: 1.e-12
  reconstruct:
    vertical: {type: weno5, scale: true, shock: false}
    horizontal: {type: weno5, scale: true, shock: false}
  riemann-solver: {type: lmars}
geometry:
  type: cartesian
  cells: {nx1: 32, nx2: 64, nx3: 1, nghost: 3}
  bounds: {x1min: -0.5, x1max: 0.5, x2min: 0., x2max: 2.8, x3min: 0., x3max: 1.}
distribute: {layout: slab, nb1: 1, nb2: 1, nb3: 1, blocks_per_process: 1}
boundary-condition:
  external:
    x1-inner: reflecting
    x1-outer: reflecting
    x2-inner: periodic
    x2-outer: periodic
forcing:
  const-gravity: {grav1: -1.25}
  diffusion:
    dynamic: true
    nu_iso: 0.03
    kappa_iso: 0.075
    temperature_inner: 1.5
    temperature_outer: 0.5
integration: {type: rk3, cfl: 0.4}
